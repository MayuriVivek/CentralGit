---
- name: To install packages
  hosts: all
  become: true
  tasks:
    - name: Install git
      package:
        name: git
        state: installed

    - name: Install httpd
      yum:
        name: httpd
        state: present
      when: ansible_os_family == "RedHat"
      
    - name: start service
      service: 
        name: httpd
        state: restarted
      when: ansible_os_family == "RedHat"

    - name: Install apache2
      package:
        name: apache2
        state: installed
      when: ansible_os_family == "Debian"

    - name: start service
      service:
        name: apache2
        state: restarted
      when: ansible_os_family == "Debian"

    - name: copy index file
      copy:
        src: /home/ansadmin/index.html
        dest: /var/www/html
        mode: 0666
